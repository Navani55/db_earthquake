# The main pipeline for db_earthquake_bundle

resources:
  pipelines:
    db_earthquake_bundle_etl:
      name: db_earthquake_bundle_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      root_path: "../src/db_earthquake_bundle_etl"

      libraries:
        - glob:
            include: ../src/db_earthquake_bundle_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
