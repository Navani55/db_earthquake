    mode: development
    default: true
    workspace:
      host: https://dbc-3629ef0f-8276.cloud.databricks.com
    variables:
      catalog: workspace
      schema: dev
    presets:
      artifacts_dynamic_version: true
  prod:
    mode: production
    workspace:
      host: https://dbc-3629ef0f-8276.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/navaneemechts@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/navaneemechts@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: navaneemechts@gmail.com
        level: CAN_MANAGE
