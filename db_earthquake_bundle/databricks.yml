bundle:
  name: db_earthquake_bundle
  uuid: 0dde38bb-4b89-4f6a-befa-1944101bd545

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
